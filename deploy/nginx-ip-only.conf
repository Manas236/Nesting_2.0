# ============================================================
# Nesting Tree — nginx config for IP-ONLY private preview
# ------------------------------------------------------------
# Use this while the site is served from a bare public IP with no domain.
# Once a domain and TLS exist, switch to nginx-nestingtree.conf instead.
#
# There is no HTTPS here on purpose: Let's Encrypt cannot issue a certificate
# for a bare IP address. Access control is done at the AWS security group
# (allow port 80 only from the specific people who need it), NOT by a password.
# Treat everything served here as public-readable by anyone who learns the IP.
#
# Install:
#   sudo cp deploy/nginx-ip-only.conf /etc/nginx/sites-available/nestingtree
#   sudo ln -s /etc/nginx/sites-available/nestingtree /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# The two limit_req_zone lines must live in the http { } block of
# /etc/nginx/nginx.conf — NOT inside server { }. nginx will refuse to start
# otherwise. Put them there, not here, if you get a "directive not allowed" error.
# ============================================================

limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                       # matches the bare IP, any Host header

    root /var/www/nestingtree/dist/client;

    client_max_body_size 64k;

    # Private preview — keep it out of search results entirely.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml application/javascript
                    application/json application/xml image/svg+xml;

    # ---------- Enquiry endpoint: rate limited ----------
    location = /api/contact {
        limit_req zone=contact burst=3 nodelay;
        limit_except POST { deny all; }

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- Static assets straight from disk ----------
    # 618 MB of images and video. Never proxy these through Node.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # A miss falls through to @node rather than 404: 80 renamed photographs keep
    # their old URLs alive as 301s from src/middleware.ts, and middleware only
    # runs inside the node process. The build deletes exactly those superseded
    # originals from dist/client (scripts/prune-superseded-images.mjs) so they
    # miss here. Both halves are required — see the same block in
    # nginx-nestingtree.conf.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;      # <video> seeking
        access_log off;
        try_files $uri @node;
    }

    # Named fallback for /images/ above. Named locations live at server{} level
    # and are reachable only from within this same server block.
    location @node {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location = /favicon.ico { expires 30d; access_log off; try_files $uri =404; }

    # ---------- Everything else -> Astro node server ----------
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
