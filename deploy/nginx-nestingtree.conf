# ============================================================
# Nesting Tree — nginx site config
# ------------------------------------------------------------
# Install:
#   sudo cp deploy/nginx-nestingtree.conf /etc/nginx/sites-available/nestingtree
#   sudo ln -s /etc/nginx/sites-available/nestingtree /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes the Astro node server is running on 127.0.0.1:4321
# (see the systemd unit in DEPLOYMENT.md §5).
#
# TLS: run certbot AFTER this file is in place and DNS resolves:
#   sudo certbot --nginx -d nestingtree.in -d www.nestingtree.in
# ============================================================

# ---------- Rate limiting ----------
# MUST live in the http{} context, not inside server{}. If you paste this whole
# file into sites-available, the limit_req_zone AND map lines below need to move
# to /etc/nginx/nginx.conf inside the http { } block — nginx will refuse to
# start otherwise.
#
# contact : the enquiry endpoint. 5 requests/minute per IP. A human submits one
#           form once; anything faster is a bot. 10m of shared memory tracks
#           roughly 160k addresses.
# editauth: the editor sign-in — /api/edit-session and the /studio/ login page.
#           See the note on those locations below.
# edits   : the in-page text editor's writes. See the note below — this one is
#           keyed on the request METHOD as well as the address.
# general : a loose ceiling on everything else, so one client cannot hammer the
#           node process. Generous because a single page pulls many assets.
limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=editauth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# /api/content is read on EVERY page view and written only when somebody edits
# a line of copy, so one rate cannot serve both: throttle it hard enough to be
# worth having and ordinary browsing starts returning 429s.
#
# So the write zone is keyed on this map instead of the address directly. nginx
# skips a limit_req whose key evaluates to the empty string, which means GETs
# are simply not accounted here — they fall through to `general` — while POSTs
# are counted per IP. 20/minute is far more editing than a person does and far
# less than a script wants.
map $request_method $content_write_ip {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $content_write_ip zone=edits:10m rate=20r/m;

# Return 429 (Too Many Requests) rather than nginx's default 503, so bots and
# monitoring can tell throttling apart from an outage.
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name nestingtree.in www.nestingtree.in;

    # ACME challenge must stay on plain HTTP for certbot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 is enabled as a `listen` PARAMETER, not the standalone `http2 on;`
    # directive. That directive arrived in nginx 1.25.1; Ubuntu 24.04 LTS ships
    # nginx 1.24, where it is an unknown directive and `nginx -t` fails outright
    # — the site does not come up at all. Check with `nginx -v` before changing
    # this: on 1.25.1+ the parameter is deprecated (a warning, not an error) and
    # the standalone directive is the right form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nestingtree.in www.nestingtree.in;

    # certbot fills these in; paths shown for reference.
    ssl_certificate     /etc/letsencrypt/live/nestingtree.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nestingtree.in/privkey.pem;

    root /var/www/nestingtree/dist/client;

    # The enquiry form posts a handful of short fields. Nothing is uploaded,
    # so keep the accepted body small — it costs a spammer nothing to try.
    client_max_body_size 64k;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- Compression ----------
    # Videos and JPEGs are already compressed; gzipping them wastes CPU.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml;

    # ============================================================
    # THE RATE LIMIT THAT MATTERS
    # /api/contact is a public, unauthenticated POST that writes a database row
    # on every call. Without this, bots will fill the leads table.
    #
    # burst=3 nodelay  -> a genuine double-click or retry still succeeds;
    #                     sustained hammering gets 429 immediately.
    # ============================================================
    location = /api/contact {
        limit_req zone=contact burst=3 nodelay;

        # Only POST makes sense here. Anything else is a probe.
        limit_except POST { deny all; }

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # EDITOR SIGN-IN — the brute-force ceiling
    #
    # One shared passphrase protects every word on the site. Without a limit
    # here, that passphrase is only as good as the number of guesses somebody
    # is willing to make, and the answer to that is "millions, overnight,
    # from a laptop". 5/minute per address is the whole difference between a
    # shared secret and a shared secret that holds.
    #
    # burst=3 nodelay -> a mistyped passphrase and two retries go straight
    #                    through; the fourth in a minute gets 429.
    #
    # GET is allowed as well as POST because the editor asks this endpoint
    # whether it is still signed in; DELETE is the sign-out.
    # ============================================================
    location = /api/edit-session {
        limit_req zone=editauth burst=3 nodelay;

        limit_except POST GET DELETE { deny all; }

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # The login page itself, at /studio/<secret slug>.
    #
    # The slug is what keeps this page off crawlers and wordlists, so the
    # thing to stop is somebody enumerating it. Same 5/minute zone: a wrong
    # slug is a plain 404, indistinguishable from any other, and at five
    # tries a minute a dictionary run is not worth starting.
    #
    # ^~ so the prefix wins outright over the catch-all below.
    #
    # THE add_header BLOCK IS NOT A COPY-PASTE MISTAKE. nginx's add_header
    # directives are inherited from the enclosing block ONLY IF the current
    # block defines none of its own — declare one here and all four from the
    # server{} level are dropped. So they are repeated, with one changed:
    # Referrer-Policy is `no-referrer` here, because the site-wide
    # strict-origin-when-cross-origin still sends the FULL URL on same-origin
    # requests, and this page's full URL is the secret. Without this, the
    # sign-in POST carries the slug in a Referer header straight into
    # access.log. The page sets the same header itself; this is the belt to
    # that braces, and it is the half that survives if the app ever stops.
    # ============================================================
    location ^~ /studio/ {
        limit_req zone=editauth burst=3 nodelay;

        limit_except GET { deny all; }

        add_header X-Content-Type-Options    "nosniff"     always;
        add_header X-Frame-Options           "SAMEORIGIN"  always;
        add_header Referrer-Policy           "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # The in-page text editor: /api/content, /api/content/revert,
    # /api/content/history.
    #
    # Same shape as /api/contact — a POST that writes a database row —
    # except the writes here are behind a signed session cookie
    # (src/lib/edit-auth.ts) and this one writes the words on the site. The
    # table is append-only, so even a flood by somebody signed in costs
    # storage and a long undo rather than corruption.
    #
    # The limits stay whatever the session does. They are what keeps an
    # unauthenticated flood from reaching node at all, and every request
    # refused here is one the token check never has to run.
    #
    # ^~ so this prefix wins outright and these requests never fall through
    # to the catch-all location below.
    #
    # burst=5 nodelay  -> fixing a paragraph, changing your mind and undoing
    #                     it all works at human speed; a script gets 429 on
    #                     its sixth write.
    # ============================================================
    location ^~ /api/content {
        limit_req zone=edits   burst=5  nodelay;   # POSTs only (see the map)
        limit_req zone=general burst=60 nodelay;   # reads, same ceiling as the site

        # Reads and writes only. Anything else is a probe.
        limit_except GET POST { deny all; }

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- Static assets served straight from disk ----------
    # Never proxy these through Node: 617 MB of images and video would pin the
    # single node process on every request. nginx serves them far faster.

    # Fingerprinted build output — safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Photos, renders, floor plans, background video.
    #
    # A miss falls through to @node instead of answering 404. 80 renamed
    # photographs keep their old URLs alive as 301s (src/lib/image-redirects.ts,
    # served by src/middleware.ts), and middleware only runs inside the node
    # process — so an old URL has to reach node to be redirected. The build
    # deletes exactly those superseded originals from dist/client
    # (scripts/prune-superseded-images.mjs) so that they miss here.
    #
    # Both halves are required: without the prune the original is still on disk
    # and answers 200, so the redirect never fires; without this fallback the
    # pruned URLs answer 404 instead of 301.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        # Range requests matter for <video> seeking.
        add_header Accept-Ranges bytes;
        try_files $uri @node;
    }

    # Named fallback for the static locations above. Named locations live at
    # server{} level and are only reachable from within this same server block.
    # Same proxy setup as `location /`, minus the rate-limit burst tuning notes:
    # what arrives here is an old image URL to redirect or a genuine miss, both
    # cheap, but keep the general ceiling so /images/ is not an unthrottled
    # route into the single node process.
    location @node {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location = /favicon.ico { expires 30d; access_log off; try_files $uri =404; }
    location = /robots.txt  { expires 1d;  access_log off; try_files $uri =404; }

    # ---------- Everything else -> the Astro node server ----------
    # Most routes are prerendered HTML, but /thank-you is rendered on demand,
    # so all non-asset traffic goes to Node.
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
