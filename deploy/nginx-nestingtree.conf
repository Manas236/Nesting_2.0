# ============================================================
# Nesting Tree — nginx site config
# ------------------------------------------------------------
# Install:
#   sudo cp deploy/nginx-nestingtree.conf /etc/nginx/sites-available/nestingtree
#   sudo ln -s /etc/nginx/sites-available/nestingtree /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes the Astro node server is running on 127.0.0.1:4321
# (see the systemd unit in DEPLOYMENT.md §5).
#
# TLS: run certbot AFTER this file is in place and DNS resolves:
#   sudo certbot --nginx -d nestingtree.in -d www.nestingtree.in
# ============================================================

# ---------- Rate limiting ----------
# MUST live in the http{} context, not inside server{}. If you paste this whole
# file into sites-available, these two lines need to move to /etc/nginx/nginx.conf
# inside the http { } block — nginx will refuse to start otherwise.
#
# contact : the enquiry endpoint. 5 requests/minute per IP. A human submits one
#           form once; anything faster is a bot. 10m of shared memory tracks
#           roughly 160k addresses.
# general : a loose ceiling on everything else, so one client cannot hammer the
#           node process. Generous because a single page pulls many assets.
limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# Return 429 (Too Many Requests) rather than nginx's default 503, so bots and
# monitoring can tell throttling apart from an outage.
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name nestingtree.in www.nestingtree.in;

    # ACME challenge must stay on plain HTTP for certbot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nestingtree.in www.nestingtree.in;

    # certbot fills these in; paths shown for reference.
    ssl_certificate     /etc/letsencrypt/live/nestingtree.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nestingtree.in/privkey.pem;

    root /var/www/nestingtree/dist/client;

    # The enquiry form posts a handful of short fields. Nothing is uploaded,
    # so keep the accepted body small — it costs a spammer nothing to try.
    client_max_body_size 64k;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- Compression ----------
    # Videos and JPEGs are already compressed; gzipping them wastes CPU.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml;

    # ============================================================
    # THE RATE LIMIT THAT MATTERS
    # /api/contact is a public, unauthenticated POST that writes a database row
    # on every call. Without this, bots will fill the leads table.
    #
    # burst=3 nodelay  -> a genuine double-click or retry still succeeds;
    #                     sustained hammering gets 429 immediately.
    # ============================================================
    location = /api/contact {
        limit_req zone=contact burst=3 nodelay;

        # Only POST makes sense here. Anything else is a probe.
        limit_except POST { deny all; }

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- Static assets served straight from disk ----------
    # Never proxy these through Node: 617 MB of images and video would pin the
    # single node process on every request. nginx serves them far faster.

    # Fingerprinted build output — safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Photos, renders, floor plans, background video.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;

        # Range requests matter for <video> seeking.
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location = /favicon.ico { expires 30d; access_log off; try_files $uri =404; }
    location = /robots.txt  { expires 1d;  access_log off; try_files $uri =404; }

    # ---------- Everything else -> the Astro node server ----------
    # Most routes are prerendered HTML, but /thank-you is rendered on demand,
    # so all non-asset traffic goes to Node.
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
